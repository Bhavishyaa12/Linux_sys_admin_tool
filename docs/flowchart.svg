<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 1000" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<rect x="0" y="0" width="970" height="1000" fill="white"/>
<line x1="820" y1="355" x2="820" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="270" y1="60" x2="460" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="60" x2="440" y2="170" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="422" y="105" width="56" height="16" fill="white" opacity="0.9"/>
<text x="450" y="118" font-size="11" text-anchor="middle" fill="#555">Linux</text>
<line x1="680" y1="60" x2="740" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="678" y="110" width="63" height="16" fill="white" opacity="0.9"/>
<text x="710" y="123" font-size="11" text-anchor="middle" fill="#555">Not Linux</text>
<line x1="820" y1="210" x2="820" y2="285" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360" y1="200" x2="360" y2="285" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="250" y1="315" x2="260" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="227" y="362" width="56" height="16" fill="white" opacity="0.9"/>
<text x="255" y="376" font-size="11" text-anchor="middle" fill="#555">root</text>
<line x1="470" y1="315" x2="420" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="417" y="362" width="56" height="16" fill="white" opacity="0.9"/>
<text x="445" y="376" font-size="11" text-anchor="middle" fill="#555">not root</text>
<line x1="510" y1="460" x2="510" y2="515" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="170" y1="460" x2="170" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="280" y1="555" x2="210" y2="698" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="758" x2="350" y2="799" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="859" x2="350" y2="900" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="620" y1="550" x2="710" y2="430" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50" y="30" width="220" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="160" y="57" font-size="11.5" text-anchor="middle" fill="#111">User runs</text>
<text x="160" y="71" font-size="11.5" text-anchor="middle" fill="#111">$sudo python3 linux_audit.py {--options}</text>
<rect x="460" y="30" width="220" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="570" y="57" font-size="11.5" text-anchor="middle" fill="#111">Check operating system</text>
<text x="570" y="71" font-size="11.5" text-anchor="middle" fill="#111">(platform.system())</text>
<rect x="280" y="140" width="160" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="360" y="174" font-size="11.5" text-anchor="middle" fill="#111">Linux</text>
<rect x="740" y="150" width="160" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="820" y="184" font-size="11.5" text-anchor="middle" fill="#111">Not Linux</text>
<rect x="710" y="285" width="220" height="70" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="820" y="317" font-size="11.5" text-anchor="middle" fill="#111">Print &quot;Unsupported OS&quot;</text>
<text x="820" y="331" font-size="11.5" text-anchor="middle" fill="#111">return error (exit code 2)</text>
<rect x="250" y="285" width="220" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="360" y="312" font-size="11.5" text-anchor="middle" fill="#111">Check effective UID</text>
<text x="360" y="326" font-size="11.5" text-anchor="middle" fill="#111">(os.geteuid())</text>
<rect x="80" y="400" width="180" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="170" y="434" font-size="11.5" text-anchor="middle" fill="#111">UID == 0 (root)</text>
<rect x="420" y="400" width="180" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="510" y="434" font-size="11.5" text-anchor="middle" fill="#111">UID != 0</text>
<rect x="400" y="515" width="220" height="70" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="510" y="547" font-size="11.5" text-anchor="middle" fill="#111">Print &quot;Please run as root&quot;</text>
<text x="510" y="561" font-size="11.5" text-anchor="middle" fill="#111">exit 2</text>
<rect x="60" y="520" width="220" height="70" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="170" y="552" font-size="11.5" text-anchor="middle" fill="#111">run_linux():</text>
<text x="170" y="566" font-size="11.5" text-anchor="middle" fill="#111">argparse parses flags</text>
<rect x="210" y="638" width="280" height="120" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="350" y="674" font-size="11.5" text-anchor="middle" fill="#111">Options provide with an optional bash tab completion script</text>
<text x="350" y="688" font-size="11.5" text-anchor="middle" fill="#111">--check / --list / --remove</text>
<text x="350" y="702" font-size="11.5" text-anchor="middle" fill="#111">--users / --permissions / --suid</text>
<text x="350" y="716" font-size="11.5" text-anchor="middle" fill="#111">--processes / --network / --services</text>
<text x="350" y="730" font-size="11.5" text-anchor="middle" fill="#111">--logs / --system / --audit / -f</text>
<rect x="240" y="799" width="220" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="350" y="826" font-size="11.5" text-anchor="middle" fill="#111">Selected function executes</text>
<text x="350" y="840" font-size="11.5" text-anchor="middle" fill="#111">and return exit codes</text>
<rect x="230" y="900" width="240" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="350" y="927" font-size="11.5" text-anchor="middle" fill="#111">Return exit code</text>
<text x="350" y="941" font-size="11.5" text-anchor="middle" fill="#111">(0 = success, 1 = failure, 2 = error)</text>
<rect x="710" y="400" width="220" height="60" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="2"/>
<text x="820" y="427" font-size="11.5" text-anchor="middle" fill="#111">END: script exits immediately</text>
<text x="820" y="441" font-size="11.5" text-anchor="middle" fill="#111">(exit code 2 — OS check or root check failed)</text>
</svg>